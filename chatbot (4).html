<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>인천하늘고 챗봇</title>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.botframework.com/botframework-webchat/latest/webchat.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:         #DE8DE2;
      --pink-light:   #f3d6f5;
      --pink-pale:    #faf1fb;
      --pink-border:  #e8b8ec;
      --green:        #5A6C3D;
      --green-light:  #d4dcbe;
      --green-pale:   #eef2e6;
      --green-border: #b0bc8a;
      --cream:        #fdfaf8;
      --text:         #3a3530;
      --text-muted:   #7a7268;
      --border:       #e8e0d8;
    }

    html, body {
      height: 100%;
      background: var(--cream);
      font-family: 'Gowun Dodum', serif;
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.20;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 500px; height: 500px;
      background: var(--pink);
      top: -120px; right: -100px;
    }
    body::after {
      width: 420px; height: 420px;
      background: var(--green-light);
      bottom: -100px; left: -80px;
    }

    .chat-window {
      position: relative;
      z-index: 1;
      width: 50vw;
      height: 66.67vh;
      min-width: 340px;
      min-height: 420px;
      background: rgba(253,250,248,0.95);
      border-radius: 24px;
      border: 1px solid var(--pink-border);
      box-shadow: 0 8px 32px rgba(90,108,61,0.10), 0 2px 8px rgba(222,141,226,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(8px);
      animation: fadeUp 0.5s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* header */
    .chat-header {
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--pink-pale) 0%, var(--green-pale) 100%);
      border-bottom: 1px solid var(--pink-border);
      padding: 13px 18px 11px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, var(--pink) 30%, var(--green) 100%);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .avatar svg { width: 18px; height: 18px; fill: #fff; }

    .header-info { flex: 1; }
    .header-info .name {
      font-family: 'Nanum Myeongjo', serif;
      font-size: 0.93rem; font-weight: 700;
      color: var(--green); letter-spacing: -0.2px;
    }
    .header-info .sub {
      font-size: 0.70rem; color: var(--text-muted); margin-top: 1px;
    }

    .status-pill {
      display: flex; align-items: center; gap: 5px;
      font-size: 0.68rem; color: var(--green);
      background: var(--green-pale);
      border: 1px solid var(--green-border);
      border-radius: 20px; padding: 3px 10px 3px 6px;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green); animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.5; transform: scale(1.3); }
    }

    .icon-btn {
      width: 30px; height: 30px; border-radius: 8px;
      border: 1px solid var(--pink-border);
      background: transparent; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .icon-btn:hover { background: var(--pink-pale); border-color: var(--pink); color: var(--pink); }
    .icon-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* webchat area */
    #webchat-container {
      flex: 1;
      min-height: 0;
      position: relative;
    }

    #webchat {
      width: 100%;
      height: 100%;
    }

    /* loading overlay */
    #loading {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: var(--cream);
      z-index: 5;
      transition: opacity 0.4s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 36px; height: 36px;
      border: 2.5px solid var(--pink-light);
      border-top-color: var(--pink);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 0.78rem; color: var(--text-muted); }

    /* footer */
    .chat-footer {
      flex-shrink: 0;
      padding: 7px 14px;
      border-top: 1px solid var(--pink-border);
      background: var(--pink-pale);
      display: flex; align-items: center; gap: 7px;
    }
    .footer-note { flex: 1; font-size: 0.68rem; color: var(--text-muted); }
    .footer-btn {
      font-family: 'Gowun Dodum', serif;
      font-size: 0.70rem; padding: 4px 12px;
      border-radius: 20px; border: 1px solid var(--green-border);
      background: transparent; color: var(--green); cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .footer-btn:hover { background: var(--green-pale); border-color: var(--green); }
    .footer-btn.pink { border-color: var(--pink-border); color: #a05ca4; }
    .footer-btn.pink:hover { background: var(--pink-pale); border-color: var(--pink); }

    @media (max-width: 700px) {
      body { padding: 0; }
      .chat-window { width: 100vw; height: 100vh; border-radius: 0; border: none; min-width: unset; }
    }
  </style>
</head>
<body>

<div class="chat-window">

  <!-- header -->
  <div class="chat-header">
    <div class="avatar" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M20 2H4C2.9 2 2 2.9 2 4v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
    </div>
    <div class="header-info">
      <div class="name">인천하늘고 챗봇</div>
      <div class="sub">Copilot Studio · 학습 도우미</div>
    </div>
    <div class="status-pill"><span class="dot"></span>온라인</div>
    <button class="icon-btn" title="새로고침" id="refresh-btn">
      <svg viewBox="0 0 24 24"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
    </button>
  </div>

  <!-- webchat -->
  <div id="webchat-container">
    <div id="loading">
      <div class="spinner"></div>
      <span class="loading-text">챗봇을 불러오는 중…</span>
    </div>
    <div id="webchat"></div>
  </div>

  <!-- footer -->
  <div class="chat-footer">
    <span class="footer-note">Microsoft Copilot Studio 기반</span>
    <button class="footer-btn pink" id="help-btn">도움말</button>
    <button class="footer-btn" id="new-btn">새 대화</button>
  </div>

</div>

<script>
  const TOKEN_ENDPOINT =
    'https://default-62ae463a-9f12-4edf-8544-4f6ca3834524.24.environment.api.powerplatform.com/powervirtualagents/botsbyschema/cre4a_msncQbjT/directline/token?api-version=2022-03-01-preview';

  const styleOptions = {
    /* ── font ── */
    fontFamily: "'Gowun Dodum', serif",
    fontSize: 14,

    /* ── bubble (bot) ── */
    bubbleBackground: '#faf1fb',
    bubbleBorderColor: '#e8b8ec',
    bubbleBorderRadius: 16,
    bubbleBorderWidth: 1,
    bubbleTextColor: '#3a3530',
    bubbleMinWidth: 60,
    bubbleMaxWidth: 480,

    /* ── bubble (user) ── */
    bubbleFromUserBackground: '#eef2e6',
    bubbleFromUserBorderColor: '#b0bc8a',
    bubbleFromUserBorderRadius: 16,
    bubbleFromUserBorderWidth: 1,
    bubbleFromUserTextColor: '#3a3530',

    /* ── avatar ── */
    botAvatarBackgroundColor: '#DE8DE2',
    hideUploadButton: true,

    /* ── send box ── */
    sendBoxBackground: '#fdfaf8',
    sendBoxBorderBottom: '1.5px solid #e8b8ec',
    sendBoxBorderLeft: 'none',
    sendBoxBorderRight: 'none',
    sendBoxBorderTop: 'none',
    sendBoxButtonColor: '#5A6C3D',
    sendBoxButtonColorOnFocus: '#DE8DE2',
    sendBoxButtonColorOnHover: '#DE8DE2',
    sendBoxTextColor: '#3a3530',
    sendBoxPlaceholderColor: '#b0a898',
    sendBoxHeight: 48,

    /* ── timestamp ── */
    timestampColor: '#b0a898',
    timestampFormat: 'relative',

    /* ── suggested actions (outline only) ── */
    suggestedActionBackground: 'transparent',
    suggestedActionBorderColor: '#e8b8ec',
    suggestedActionBorderRadius: 20,
    suggestedActionBorderWidth: 1,
    suggestedActionTextColor: '#a05ca4',
    suggestedActionBackgroundColorOnHover: '#faf1fb',
    suggestedActionBorderColorOnHover: '#DE8DE2',
    suggestedActionTextColorOnHover: '#DE8DE2',

    /* ── transcript ── */
    transcriptVisualKeyboardIndicatorColor: '#DE8DE2',
    transcriptOverlayButtonBackground: 'transparent',
  };

  let directLine = null;
  let store = null;

  async function initWebChat() {
    document.getElementById('loading').classList.remove('hidden');
    try {
      const res = await fetch(TOKEN_ENDPOINT, { method: 'POST' });
      const { token } = await res.json();

      if (directLine) directLine.end();
      directLine = window.WebChat.createDirectLine({ token });
      store = window.WebChat.createStore();

      window.WebChat.renderWebChat(
        {
          directLine,
          store,
          styleOptions,
          locale: 'ko-KR',
        },
        document.getElementById('webchat')
      );

      /* hide loading once first activity arrives */
      store.subscribe(() => {
        const state = store.getState();
        if (state.activities && state.activities.length > 0) {
          document.getElementById('loading').classList.add('hidden');
        }
      });

      /* fallback hide */
      setTimeout(() => document.getElementById('loading').classList.add('hidden'), 3000);

    } catch (e) {
      console.error('WebChat 초기화 실패:', e);
      document.getElementById('loading').innerHTML =
        '<span style="color:#a05ca4;font-size:0.8rem;">연결에 실패했습니다. 새로고침을 눌러 주세요.</span>';
    }
  }

  document.getElementById('refresh-btn').addEventListener('click', initWebChat);
  document.getElementById('new-btn').addEventListener('click', initWebChat);
  document.getElementById('help-btn').addEventListener('click', () => {
    if (directLine) {
      store.dispatch({
        type: 'WEB_CHAT/SEND_MESSAGE',
        payload: { text: '도움말' }
      });
    }
  });

  initWebChat();
</script>
</body>
</html>
